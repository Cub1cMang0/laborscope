spring:

  application:
    name: laborscope

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}

    listener:
      immediate-stop: true
      ack-mode: record

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

    consumer:
      max-poll-records: 10
      group-id: laborscope-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.laborscope.*"
        
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  address: 127.0.0.1

crawler:
  default-seed-url: ${CRAWLER_DEFAULT_SEED_URL:https://en.wikipedia.org/wiki/Computer_science}
  max-depth: ${CRAWLER_MAX_DEPTH:1}
  request-delay-ms: ${CRAWLER_REQUEST_DELAY_MS:500}
  user-agent: "${CRAWLER_USER_AGENT:WikiCrawl/1.0 (+https://github.com/Cub1cMang0/laborscope)}"
  timeout-ms: 10000
  kafka:
    topic-crawl-jobs: crawl-jobs
    topic-nlp-jobs: nlp-jobs

logging:
  level:
    root: INFO
    com.laborscope: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN